name: MiniDroid DevSecOps Pipeline

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-and-scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest

    # Use a container to ensure a consistent environment
    container:
      image: ubuntu:22.04

    steps:
      # 1. Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Setup Build Environment
      #    Installs all necessary languages (Java, Python, Go, C++) and 3rd party tools.
      - name: Install Dependencies
        run: |
          # --- System Dependencies ---
          apt-get update && apt-get install -y \
            wget curl build-essential git gcc unzip zip \
            python3 python3-pip golang-go openjdk-17-jdk maven

          # --- Security Tools ---
          
          # Install Syft (SBOM Generator)
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

          # Install Scalibr (Vulnerability Scanner - Replaces OSV-Scanner)
          # We use GOBIN to install directly to /usr/local/bin for easy access
          export GOBIN=/usr/local/bin
          go install github.com/google/osv-scalibr/binary/scalibr@latest

          # Install CycloneDX CLI (For SBOM Merging)
          wget -q https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.25.0/cyclonedx-linux-x64 -O /usr/local/bin/cyclonedx
          chmod +x /usr/local/bin/cyclonedx

          # Install Snyk CLI (Vulnerability Scanner)
          curl -L https://github.com/snyk/snyk/releases/latest/download/snyk-linux -o /usr/local/bin/snyk
          chmod +x /usr/local/bin/snyk

          # --- Build Tools ---

          # Install Conan (C++ Package Manager)
          pip3 install conan

          # Install Gradle 8.5 (Build Tool)
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip -d /opt
          ln -s /opt/gradle-8.5/bin/gradle /usr/local/bin/gradle

      # 3. Execution
      #    Runs the main build script which handles compilation, SBOM generation, and scanning.
      - name: Build and Security Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          chmod +x ./build_and_scan.sh
          ./build_and_scan.sh

      # 4. Artifact Uploads
      
      # Upload the Consolidated SBOM (Software Bill of Materials)
      - name: Upload Master SBOM
        uses: actions/upload-artifact@v3
        with:
          name: Master-SBOM
          path: out/target/product/generic/MASTER_PLATFORM_SBOM.json
          if-no-files-found: warn

      # Upload the Security Scan Report (generated by Snyk)
      - name: Upload Security Report
        uses: actions/upload-artifact@v3
        with:
          name: Snyk-Vulnerability-Report
          path: out/target/product/generic/Snyk_SBOM_security_scan.json
          if-no-files-found: warn
